name: 保活心跳

# 为什么需要这个文件：
# GitHub 会在仓库「连续 60 天无活动」后自动禁用该仓库的定时工作流。
# 本仓库平时只有定时任务在跑、没有人工提交，因此可能被停掉。
# 这里每月提交一次心跳文件，产生仓库活动，保证「构建并推送镜像」继续按点运行。
#
# 为什么和 build.yml 分开：
# build.yml 有 push 触发。若把心跳步骤放进 build.yml，心跳提交 → 触发 push →
# 再跑心跳 → 再提交，会形成无限循环。本文件只由 schedule / 手动触发，不监听 push。
# 心跳提交信息带 [skip ci]，也不会去触发 build.yml。

on:
  schedule:
    # 每月 1 日 UTC 00:00 = 北京时间 08:00
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 提交心跳
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          if git diff --cached --quiet; then
            echo "心跳内容无变化，跳过提交"
          else
            git commit -m "chore: 保活心跳 $(date -u +%Y-%m) [skip ci]"
            git push
            echo "已提交心跳，定时工作流保活"
          fi
