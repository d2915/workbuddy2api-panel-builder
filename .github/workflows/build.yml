name: 构建并推送镜像

# 本仓库只做一件事：把上游源码编译成镜像并推送到 GHCR，
# 让 NAS 上的 Watchtower 能像更新 cli-proxy-api 一样自动更新 workbuddy2api-panel。
#
# 这个文件是唯一必需的文件；仓库里其他内容都只是本地辅助材料。

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，比 NAS 上 Watchtower 的 04:00 早 2 小时
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "忽略上游部署文件变更拦截，强制构建"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  UPSTREAM_REPO: linguo2625469/workbuddy2api-panel
  IMAGE_NAME: workbuddy2api-panel

  # ── 上游部署文件基线（对应提交 88545c1 / 版本 1.9.1-panel）──────────────
  # 上游一旦改动 Dockerfile 或 docker-compose.yml，构建会自动停止并提示你确认，
  # 避免上游部署方式的变化（例如改成镜像内编译）被静默套用到你的部署上。
  # 确认无误后，把下面两行改成 Actions 日志里打印的「上游」值，提交即可放行。
  #
  # 注意：这两个哈希是「剥离 CR 之后」的内容哈希（LF 口径）。
  # 工作流里用 `tr -d '\r'` 归一化后再哈希，因此在 Windows 上算出来的值
  # 与 Linux runner 上算出来的值一致，不受 core.autocrlf 影响。
  BASELINE_DOCKERFILE: cd8c27229aadeaba5b522a6ac92d78305fb49c8514aec3d2cbc195e6be7b1db3
  BASELINE_COMPOSE: 2564ebf2a7ef668e464be264b764f00357e7492a69463f24714b124f7d6c0896

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 拉取上游源码
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" upstream
          cd upstream
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          VER=$(grep -oP 'const appVersion = "\K[^"]+' cmd/server/main.go || echo unknown)
          # 写入 $GITHUB_ENV 供后续步骤使用（当前步骤内不可见，故用上面的局部变量打印）
          {
            echo "UPSTREAM_SHA=$SHA"
            echo "UPSTREAM_SHORT=$SHORT"
            echo "UPSTREAM_VERSION=$VER"
          } >> "$GITHUB_ENV"
          echo "上游提交: $SHORT  版本: $VER"

      - name: 上游部署文件变更拦截
        run: |
          set -euo pipefail
          cd upstream
          # 剥离 CR 后哈希：Windows 检出（core.autocrlf）与 Linux runner 口径一致，
          # 避免仅因换行符差异就误判为「上游改动了部署文件」。
          D_NEW=$(tr -d '\r' < Dockerfile | sha256sum | cut -d' ' -f1)
          C_NEW=$(tr -d '\r' < docker-compose.yml | sha256sum | cut -d' ' -f1)

          CHANGED=""
          [ "$D_NEW" = "$BASELINE_DOCKERFILE" ] || CHANGED="${CHANGED}Dockerfile "
          [ "$C_NEW" = "$BASELINE_COMPOSE" ] || CHANGED="${CHANGED}docker-compose.yml "

          if [ -n "$CHANGED" ] && [ "${{ inputs.force_build }}" != "true" ]; then
            {
              echo "## 已停止：上游部署文件发生变化"
              echo ""
              echo "变化文件：\`${CHANGED}\`"
              echo ""
              echo "| 文件 | 基线 | 上游 |"
              echo "|---|---|---|"
              echo "| Dockerfile | \`${BASELINE_DOCKERFILE}\` | \`${D_NEW}\` |"
              echo "| docker-compose.yml | \`${BASELINE_COMPOSE}\` | \`${C_NEW}\` |"
              echo ""
              echo "确认无误后，把 build.yml 里的 \`BASELINE_DOCKERFILE\` / \`BASELINE_COMPOSE\` 改成上面的『上游』值，提交即可放行。"
              echo ""
              echo "查看上游改动：https://github.com/${UPSTREAM_REPO}/commit/${UPSTREAM_SHA}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::上游部署文件变化（${CHANGED}），已停止自动构建，请人工确认"
            exit 1
          fi
          echo "拦截检查通过（变化文件：${CHANGED:-无}）"

      - name: 计算镜像地址
        id: img
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 该提交是否已构建过
        id: check
        run: |
          set -euo pipefail
          if docker manifest inspect "${{ steps.img.outputs.ref }}:${UPSTREAM_SHORT}" >/dev/null 2>&1; then
            echo "提交 ${UPSTREAM_SHORT} 已构建过，跳过（避免无意义重建触发 Watchtower 重启）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ env.UPSTREAM_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}

      - name: 汇总
        run: |
          {
            echo "## ${{ steps.check.outputs.skip == 'true' && '无需构建' || '构建完成' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 上游提交 | \`${UPSTREAM_SHA}\` |"
            echo "| 版本 | \`${UPSTREAM_VERSION}\` |"
            echo "| 镜像 | \`${{ steps.img.outputs.ref }}:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
