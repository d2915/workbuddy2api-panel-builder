name: 构建并推送镜像

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，比 NAS 上 Watchtower 的 04:00 早 2 小时
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "忽略上游部署文件变更拦截，强制构建"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  UPSTREAM_REPO: linguo2625469/workbuddy2api-panel
  IMAGE_NAME: workbuddy2api-panel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 拉取上游源码
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" upstream
          cd upstream
          {
            echo "UPSTREAM_SHA=$(git rev-parse HEAD)"
            echo "UPSTREAM_SHORT=$(git rev-parse --short HEAD)"
            echo "UPSTREAM_VERSION=$(grep -oP 'const appVersion = "\K[^"]+' cmd/server/main.go || echo unknown)"
          } >> "$GITHUB_ENV"
          echo "上游提交: $UPSTREAM_SHORT  版本: $UPSTREAM_VERSION"

      - name: 上游部署文件变更拦截
        run: |
          set -euo pipefail
          cd upstream
          D_NEW=$(sha256sum Dockerfile | cut -d' ' -f1)
          C_NEW=$(sha256sum docker-compose.yml | cut -d' ' -f1)
          D_OLD=$(jq -r '.dockerfile' ../.upstream-baseline.json)
          C_OLD=$(jq -r '.docker_compose' ../.upstream-baseline.json)

          CHANGED=""
          [ "$D_NEW" = "$D_OLD" ] || CHANGED="${CHANGED}Dockerfile "
          [ "$C_NEW" = "$C_OLD" ] || CHANGED="${CHANGED}docker-compose.yml "

          if [ -n "$CHANGED" ] && [ "${{ inputs.force_build }}" != "true" ]; then
            {
              echo "## 已停止：上游部署文件发生变化"
              echo ""
              echo "变化文件：\`${CHANGED}\`"
              echo ""
              echo "| 文件 | 基线 | 上游 |"
              echo "|---|---|---|"
              echo "| Dockerfile | \`${D_OLD}\` | \`${D_NEW}\` |"
              echo "| docker-compose.yml | \`${C_OLD}\` | \`${C_NEW}\` |"
              echo ""
              echo "确认无误后，把 \`.upstream-baseline.json\` 里对应的哈希改成上面的『上游』值并提交，即可放行。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::上游部署文件变化（${CHANGED}），已停止自动构建，请人工确认"
            exit 1
          fi
          echo "拦截检查通过（变化文件：${CHANGED:-无}）"

      - name: 计算镜像地址
        id: img
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 该提交是否已构建过
        id: check
        run: |
          set -euo pipefail
          if docker manifest inspect "${{ steps.img.outputs.ref }}:${UPSTREAM_SHORT}" >/dev/null 2>&1; then
            echo "提交 ${UPSTREAM_SHORT} 已构建过，跳过（避免无意义重建触发 Watchtower 重启）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ env.UPSTREAM_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}

      - name: 汇总
        run: |
          {
            echo "## ${{ steps.check.outputs.skip == 'true' && '无需构建' || '构建完成' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 上游提交 | \`${UPSTREAM_SHA}\` |"
            echo "| 版本 | \`${UPSTREAM_VERSION}\` |"
            echo "| 镜像 | \`${{ steps.img.outputs.ref }}:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
